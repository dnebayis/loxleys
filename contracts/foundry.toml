[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
  "openzeppelin-contracts/=lib/seadrop/lib/openzeppelin-contracts/contracts/",
  "utility-contracts/=lib/seadrop/lib/utility-contracts/src/"
]
via_ir = true
solc_version = "0.8.33"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./art" }]
